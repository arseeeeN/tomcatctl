[package]
name = "tomcatctl"
version = "0.2.2"
edition = "2021"
rust-version = "1.82"
description = "Start Apache Tomcat from predefined configs instead of hand-written catalina.sh commands"
license = "MIT"
repository = "https://github.com/arseeeeN/tomcatctl"
readme = "README.md"
keywords = ["tomcat", "catalina", "java", "magnolia", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/"]

[dependencies]
clap = { version = "4.5.21", features = ["derive"] }
color-eyre = "0.6.3"
ctrlc = { version = "3.4.5", features = ["termination"] }
glob = "0.3.1"
serde = { version = "1.0.215", features = ["derive"] }
tabled = "0.17.0"
toml = "0.8.19"
xml-rs = "0.8.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2.164"
