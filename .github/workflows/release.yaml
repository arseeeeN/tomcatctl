name: Create Release Draft

on:
  workflow_dispatch:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

defaults:
  run:
    shell: bash

jobs:
  release:
    name: tomcatctl

    strategy:
      fail-fast: false
      matrix:
        target:
        - aarch64-apple-darwin
        - x86_64-apple-darwin
        # Windows is disabled until tomcatctl supports it (it relies on catalina.sh)
        # - x86_64-pc-windows-msvc
        # - aarch64-pc-windows-msvc
        - x86_64-unknown-linux-gnu
        - x86_64-unknown-linux-musl
        - aarch64-unknown-linux-gnu
        - aarch64-unknown-linux-musl
        include:
        - target: aarch64-apple-darwin
          os: macos-latest
        - target: x86_64-apple-darwin
          os: macos-latest
        # - target: x86_64-pc-windows-msvc
        #   os: windows-latest
        # - target: aarch64-pc-windows-msvc
        #   os: windows-latest
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-22.04
        - target: x86_64-unknown-linux-musl
          os: ubuntu-22.04
        - target: aarch64-unknown-linux-gnu
          os: ubuntu-22.04
        # Built natively on ARM: the musl.cc cross toolchain download is unreliable from GitHub runners
        - target: aarch64-unknown-linux-musl
          os: ubuntu-24.04-arm

    runs-on: ${{matrix.os}}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1.10.1
      with:
        target: ${{matrix.target}}
        cache: false
        rustflags: ''

    - name: Setup Nushell
      uses: hustcer/setup-nu@v3
      with:
        version: 0.98.0

    - name: Release Binary
      id: tomcatctl
      run: nu .github/workflows/release-pkg.nu
      env:
        OS: ${{ matrix.os }}
        REF: ${{ github.ref }}
        TARGET: ${{ matrix.target }}

    - name: Upload Archive
      uses: actions/upload-artifact@v4
      with:
        name: tomcatctl-${{ matrix.target }}
        path: ${{ steps.tomcatctl.outputs.archive }}
        if-no-files-found: error

  # Creates the release once after all builds, so parallel jobs can't create duplicate drafts
  # On manual runs it only collects the archives and checksums, the release itself needs a tag
  publish:
    needs: release
    name: Publish
    runs-on: ubuntu-latest
    steps:
    - name: Download Archives
      uses: actions/download-artifact@v4
      with:
        pattern: tomcatctl-*
        merge-multiple: true
        path: dist

    - name: Create Checksums
      run: cd dist && shasum -a 256 * > SHA256SUMS && cat SHA256SUMS

    - name: Create Release Draft
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        # GitHub allows several drafts for the same tag, so refuse instead of adding another one on re-runs
        existing=$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .html_url")
        if [ -n "$existing" ]; then
          echo "::error::A release for $TAG already exists: $existing. Delete it and re-run this job."
          exit 1
        fi
        gh release create "$TAG" dist/* --repo "$REPO" --draft --verify-tag --title "$TAG"
